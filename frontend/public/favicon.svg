<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Spark Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradient)" />

  <!-- Outer Accent Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#borderGradient)" stroke-width="12" opacity="0.85" />

  <!-- Subtle Tech Radar Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8 12" opacity="0.35" />

  <!-- Main Pulse Wave Graphic (Team Pulse Icon) -->
  <g filter="url(#glow)">
    <path d="M 88 272 L 160 272 L 204 176 L 260 368 L 320 128 L 368 272 L 424 272" fill="none" stroke="url(#pulseGradient)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pulse Node Points -->
    <circle cx="204" cy="176" r="14" fill="#38bdf8" />
    <circle cx="260" cy="368" r="14" fill="#a855f7" />

    <!-- Growth Peak Spark Star at highest pulse point -->
    <path d="M 320 68 L 329 110 L 371 119 L 329 128 L 320 170 L 311 128 L 269 119 L 311 110 Z" fill="url(#sparkGrad)" />
  </g>
</svg>